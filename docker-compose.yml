version: "3.8"

services:
  bituniverse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bituniverse
    restart: unless-stopped
    ports:
      # Publish the same port the production server listens on so the app is
      # reachable through the host's Tailscale/MagicDNS address.
      - "3233:3233"
    volumes:
      - ./server/data:/app/server/data
    environment:
      - NODE_ENV=production
    networks:
      - bituniverse-network

networks:
  bituniverse-network:
    driver: bridge
